<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" viewBox="0 0 1100 770" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif">
<title>1-bit ALU slice</title><desc>Lab 6 Task 1(a): one bit slice of the RV32I ALU</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0,0 L 10,5 L 0,10 z" fill="#1f2937"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="38" font-size="21" text-anchor="start" font-weight="bold" fill="#111827">Task 1(a): 1-bit ALU slice (bit i)</text>
<text x="40" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">One of 32 identical slices. A shift moves bits between slices, so SLL[i] and SRL[i] come from the shared barrel shifter.</text>
<text x="40" y="105" font-size="15" text-anchor="start" font-weight="bold" fill="#111827">A[i]</text>
<text x="40" y="135" font-size="15" text-anchor="start" font-weight="bold" fill="#111827">B[i]</text>
<polyline points="85,100 250,100 250,355" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<polyline points="85,130 280,130 280,428" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<polyline points="250,160 360,160" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<polyline points="280,180 360,180" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<circle cx="250" cy="160" r="4" fill="#1f2937"/>
<circle cx="280" cy="180" r="4" fill="#1f2937"/>
<path d="M 360,150 h 30 a 20,20 0 0 1 0,40 h -30 z" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
<polyline points="250,225 365.6,225" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<polyline points="280,245 365.6,245" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<circle cx="250" cy="225" r="4" fill="#1f2937"/>
<circle cx="280" cy="245" r="4" fill="#1f2937"/>
<path d="M 360,215 Q 375,235 360,255 Q 400,255 415,235 Q 400,215 360,215 z" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
<polyline points="250,290 365.6,290" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<polyline points="280,310 365.6,310" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<circle cx="250" cy="290" r="4" fill="#1f2937"/>
<circle cx="280" cy="310" r="4" fill="#1f2937"/>
<path d="M 360,280 Q 375,300 360,320" fill="none" stroke="#1f2937" stroke-width="2"/>
<path d="M 368,280 Q 383,300 368,320 Q 408,320 423,300 Q 408,280 368,280 z" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
<text x="385" y="138" font-size="12" text-anchor="middle" font-weight="normal" fill="#1e40af" font-style="italic">logic unit</text>
<circle cx="280" cy="388" r="4" fill="#1f2937"/>
<polyline points="280,388 390,388" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<polyline points="280,428 310,428" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<path d="M 310,416 L 336,428 L 310,440 z" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/>
<circle cx="340" cy="428" r="4" fill="white" stroke="#1f2937" stroke-width="2"/>
<polyline points="344,428 390,428" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<text x="352" y="448" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">~B[i]</text>
<polygon points="390,368 420,383 420,433 390,448" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
<text x="396" y="392" font-size="11" text-anchor="start" font-weight="normal" fill="#111827">0</text>
<text x="396" y="432" font-size="11" text-anchor="start" font-weight="normal" fill="#111827">1</text>
<polyline points="420,408 480,408" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<text x="450" y="402" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">B'</text>
<polyline points="250,355 480,355" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
<rect x="480" y="340" width="120" height="120" rx="6" fill="#ffedd5" stroke="#1f2937" stroke-width="2"/>
<text x="540.0" y="389.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827">Full adder</text>
<text x="540.0" y="404.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">(1 bit)</text>
<text x="540.0" y="419.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">sum = A^B'^Cin</text>
<polygon points="760,130 830,160 830,630 760,660" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
<text x="766" y="174" font-size="11" text-anchor="start" font-weight="bold" fill="#111827">0000</text>
<text x="766" y="239" font-size="11" text-anchor="start" font-weight="bold" fill="#111827">0001</text>
<text x="766" y="304" font-size="11" text-anchor="start" font-weight="bold" fill="#111827">0011</text>
<text x="766" y="404" font-size="11" text-anchor="start" font-weight="bold" fill="#111827">0010</text>
<text x="766" y="549" font-size="11" text-anchor="start" font-weight="bold" fill="#111827">0100</text>
<text x="766" y="599" font-size="11" text-anchor="start" font-weight="bold" fill="#111827">0101</text>
<text x="766" y="644" font-size="11" text-anchor="start" font-weight="bold" fill="#111827">other</text>
<text x="766" y="416" font-size="11" text-anchor="start" font-weight="bold" fill="#111827">0110</text>
<polyline points="410,170 760,170" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="744" y="163" font-size="12" text-anchor="end" font-weight="normal" fill="#111827">AND</text>
<polyline points="415,235 760,235" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="744" y="228" font-size="12" text-anchor="end" font-weight="normal" fill="#111827">OR</text>
<polyline points="423,300 760,300" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="744" y="293" font-size="12" text-anchor="end" font-weight="normal" fill="#111827">XOR</text>
<polyline points="600,400 760,400" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="744" y="393" font-size="12" text-anchor="end" font-weight="normal" fill="#111827">sum (ADD, SUB)</text>
<text x="730" y="645" font-size="13" text-anchor="end" font-weight="bold" fill="#111827">0</text>
<polyline points="735,640 760,640" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="795" y="118" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151" font-style="italic">result mux</text>
<text x="40" y="725" font-size="15" text-anchor="start" font-weight="bold" fill="#111827">ALUControl[3:0]</text>
<polyline points="170,720 795,720 795,647" fill="none" stroke="#1f2937" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<line x1="214" y1="728" x2="226" y2="712" stroke="#1f2937" stroke-width="1.5"/>
<text x="220" y="709" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">4</text>
<circle cx="405" cy="720" r="4" fill="#1f2937"/>
<polyline points="405,720 405,677" fill="none" stroke="#1f2937" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="305" y="640" width="200" height="36" rx="6" fill="#ede9fe" stroke="#1f2937" stroke-width="2"/>
<text x="405.0" y="662.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">SUB = (ALUControl == 0110)</text>
<polyline points="405,640 405,442" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="412" y="625" font-size="12" text-anchor="start" font-weight="bold" fill="#5b21b6">SUB</text>
<text x="412" y="462" font-size="11" text-anchor="start" font-weight="normal" fill="#5b21b6">select</text>
<text x="800" y="690" font-size="11" text-anchor="start" font-weight="normal" fill="#374151">select</text>
<polyline points="540,312 540,340" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="548" y="326" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">CarryIn  (from bit i-1)</text>
<polyline points="540,460 540,500" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="548" y="495" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">CarryOut  (to bit i+1)</text>
<rect x="600" y="522" width="100" height="96" rx="6" fill="#dcfce7" stroke="#1f2937" stroke-width="2" stroke-dasharray="6,4"/>
<text x="650.0" y="552.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">from the</text>
<text x="650.0" y="566.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">shared</text>
<text x="650.0" y="580.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">barrel</text>
<text x="650.0" y="594.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">shifter</text>
<polyline points="700,545 760,545" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="728" y="538" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">SLL[i]</text>
<polyline points="700,595 760,595" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="728" y="588" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">SRL[i]</text>
<polyline points="830,400 920,400" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="928" y="405" font-size="15" text-anchor="start" font-weight="bold" fill="#111827">Result[i]</text>
<rect x="850" y="450" width="230" height="200" rx="6" fill="#fffbeb" stroke="#1f2937" stroke-width="2"/>
<text x="965.0" y="501.7" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827">Notes</text>
<text x="965.0" y="516.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">AND/OR/XOR use B[i] directly;</text>
<text x="965.0" y="531.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">only the adder sees B[i] or ~B[i].</text>
<text x="965.0" y="546.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">SUB: B' = ~B[i], and bit 0 gets</text>
<text x="965.0" y="561.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">CarryIn = SUB = 1, so the 32 slices</text>
<text x="965.0" y="576.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">compute A + ~B + 1 = A - B.</text>
<text x="965.0" y="591.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">ADD: B' = B[i], bit 0 CarryIn = 0.</text>
<text x="965.0" y="606.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">BEQ uses SUB and checks Zero.</text>
</svg>
